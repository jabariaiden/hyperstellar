[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperstellar"
version = "1.5.2"
description = "GPU-accelerated physics simulation engine"
readme = "README.md"
authors = [{name = "Aiden Jabari", email = "Jabariaiden15@email.com"}]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["physics", "simulation", "gpu", "opengl"]
dependencies = []
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "hyperstellar/src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["hyperstellar/src"]

[tool.setuptools.package-data]
"hyperstellar" = [
    "_native/windows-x64/*.pyd",
    "_native/windows-x64/shaders/*",
    "_native/linux-x64/*.so",
    "_native/linux-x64/shaders/*",
]