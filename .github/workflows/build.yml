name: Build Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  # ============================================================================
  # WINDOWS WHEEL (Python 3.13)
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: pip install build pybind11 wheel setuptools

      - name: Build wheel
        run: .\build_python.ps1
        shell: pwsh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  # ============================================================================
  # LINUX WHEEL (Python 3.13)
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y \
            build-essential cmake pkg-config \
            libglfw3-dev libgl1-mesa-dev libx11-dev \
            python3.13 python3.13-dev python3.13-venv

      - name: Set up venv
        run: |
          python3.13 -m venv ~/hyperstellar_env
          source ~/hyperstellar_env/bin/activate
          pip install build pybind11 wheel setuptools

      - name: Build wheel
        run: |
          source ~/hyperstellar_env/bin/activate
          chmod +x build_python.sh
          ./build_python.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  # ============================================================================
  # PUBLISH TO PYPI (only on version tag e.g. v1.0.0)
  # ============================================================================
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}