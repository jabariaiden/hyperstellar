name: Build Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-win32"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64

          # Linux: only install X11 and OpenGL headers – GLFW will be built from source
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_BEFORE_BUILD_LINUX: |
            yum install -y mesa-libGL-devel libX11-devel
            bash ./build_python.sh

          # Windows: uses your pre‑placed lib/glfw/glfw3.lib
          CIBW_BEFORE_BUILD_WINDOWS: |
            powershell -File ./build_python.ps1

          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: "python -c \"import hyperstellar; print('OK')\""

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  test:
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist
      - run: |
          pip install dist/*.whl
          python -c "import hyperstellar; print('OK')"

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}