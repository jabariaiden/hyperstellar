name: Build wheels

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: manylinux
          - os: windows-latest
            plat: win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # lib/imgui, lib/glm etc. 

      # All cibuildwheel settings live in pyproject.toml. Do NOT add CIBW_* env
      # vars here: they silently override pyproject.toml.
      - uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: wheelhouse

      - name: Verify the wheel set (blocks the publish if tags are wrong)
        shell: bash
        run: |
          ls -l wheelhouse
          test "$(ls wheelhouse/*.whl | wc -l)" -eq 5 || { echo "expected 5 wheels"; exit 1; }
          for v in cp310 cp311 cp312 cp313 cp314; do
            ls wheelhouse | grep -q "${v}-${v}-${{ matrix.plat }}" || { echo "missing $v wheel"; exit 1; }
          done
          ! ls wheelhouse | grep -E 'none-any|py3-none'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write          
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist && test "$(ls dist/*.whl | wc -l)" -eq 10
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}   