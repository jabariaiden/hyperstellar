name: Build Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python build dependencies
        run: pip install build pybind11 wheel setuptools

      - name: Build
        run: .\build_python.ps1
        shell: pwsh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake pkg-config \
            libglfw3-dev libgl1-mesa-dev libx11-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python build dependencies
        run: pip install build pybind11 wheel setuptools

      - name: Build
        run: |
          chmod +x build_python.sh
          ./build_python.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  # Smoke-test the SAME wheel that build-* produced, across supported Python
  # versions, without rebuilding it (rebuilding per-version is what caused
  # the identically-named-wheel collision in the first place).
  test:
    needs: [build-windows, build-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            artifact: wheel-linux
          - os: windows-latest
            artifact: wheel-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import hyperstellar; print(hyperstellar.__version__)"

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Only wheel-windows and wheel-linux exist at this point, and each
      # contains exactly one uniquely-named wheel (different platform tags),
      # so merge-multiple is now safe.
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}