name: Build Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python build dependencies
        run: pip install build pybind11 wheel setuptools

      - name: Build
        run: .\build_python.ps1
        shell: pwsh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  build-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y glfw-devel mesa-libGL-devel libX11-devel pkgconfig cmake gcc-c++ make

      - name: Select Python
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: pip install build pybind11 wheel setuptools auditwheel patchelf

      - name: Build
        run: |
          chmod +x build_python.sh
          ./build_python.sh

      - name: Repair wheel (bundle GLFW, verify manylinux compliance)
        run: |
          auditwheel repair dist/*.whl -w dist_repaired --plat manylinux_2_28_x86_64
          rm -rf dist
          mv dist_repaired dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  test:
    needs: [build-windows, build-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            artifact: wheel-linux
          - os: windows-latest
            artifact: wheel-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install and check wheel metadata
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import importlib.metadata as m; print(m.version('hyperstellar'))"

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}