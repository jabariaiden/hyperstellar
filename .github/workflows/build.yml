name: Build Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-win32"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64

          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_PRERELEASE_PYTHONS: True

          CIBW_BEFORE_ALL_LINUX: >
            yum install -y epel-release &&
            yum install -y --enablerepo=powertools
            mesa-libGL-devel libX11-devel libXrandr-devel libXi-devel
            libXxf86vm-devel libXinerama-devel libXcursor-devel libXrender-devel
            libXext-devel libXdamage-devel libxcb-devel wget cmake gcc-c++ make

          CIBW_BEFORE_BUILD_LINUX: bash ./build_python.sh
          CIBW_BEFORE_BUILD_WINDOWS: powershell -ExecutionPolicy Bypass -File ./build_python.ps1

          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: python -c "import hyperstellar; print('OK')"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl